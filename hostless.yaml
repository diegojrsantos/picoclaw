build:
  system: docker

dockerfile_path: Dockerfile.hostless
start_command: "/app/entrypoint.sh"

scaling:
  min_replicas: 1
  max_replicas: 1
  max_cpu: 0.1
  max_memory: 256

health_check:
  type: http
  http_path: /health
  interval_in_seconds: 10

# Review apps subiriam um segundo bot com o mesmo token do Telegram (conflito getUpdates).
review_apps:
  enabled: false
